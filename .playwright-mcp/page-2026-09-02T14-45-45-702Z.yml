      - text: 主动方发
      - code [ref=e80]: Close(1000)
      - text: 后进入 CLOSING，对方回一个
      - code [ref=e81]: Close
      - text: ，双方才真正关闭并断开 TCP——和 TCP 挥手同理，保证在途数据处理完。
