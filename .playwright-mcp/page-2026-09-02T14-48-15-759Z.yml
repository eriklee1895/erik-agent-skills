  - generic [ref=f1e81]: 怎么读这张图：短轮询靠浏览器“定时敲门”，大部分敲门都扑空（灰色空响应），消息最坏要等一个轮询周期才被发现；长轮询让服务器“扣着门”等消息，没有空转，但每条消息仍要走一次完整 HTTP 请求-响应；WebSocket 只用 1 次 HTTP 升级请求，之后这条 TCP 连接一直在线，双方随时可以互相“推门说话”——服务器推送不再需要等浏览器来问。
  - generic [ref=f1e82]:
    - generic [ref=f1e83]:
      - generic [ref=f1e84]: 短轮询
      - text: 实现最简单，但请求数最多、空转浪费最大，实时性取决于轮询间隔；调快间隔等于放大浪费。
    - generic [ref=f1e85]:
      - generic [ref=f1e86]: 长轮询
      - text: 没有空轮询，延迟明显降低，但每条消息仍有 HTTP 头部开销，且连接反复建立、释放。
    - generic [ref=f1e87]:
      - generic [ref=f1e88]: WebSocket
      - text: 一次握手、长期在线、全双工：服务器可主动推送，浏览器可随时发送，帧头部仅 2–14 字节。