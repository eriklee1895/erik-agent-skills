      - text: NAT、代理和负载均衡常对“静默”的 TCP 连接做超时回收；定时
      - code [ref=f4e76]: Ping/Pong
      - text: （如 20–30s）既保活又能探测死连接，触发
      - code [ref=f4e77]: onclose
