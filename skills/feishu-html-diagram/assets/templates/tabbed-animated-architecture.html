<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="use-iframe" content="true">
  <meta name="html-box-height-mode" content="auto">
  <meta name="description" content="一个支持键盘切换、暂停和 reduced-motion 的多标签动态系统架构示例。">
  <title>多标签动态系统架构</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #edf6ff;
      --muted: #91a7bf;
      --paper: #07111d;
      --surface: #0b1929;
      --surface-2: #10243a;
      --line: #294866;
      --cyan: #49d5ff;
      --mint: #55e6b4;
      --violet: #a78bfa;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 0; }

    body {
      padding: clamp(12px, 3vw, 28px);
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      line-height: 1.5;
    }

    .diagram {
      width: 100%;
      max-width: 100%;
      overflow: clip;
      border: 1px solid #233a53;
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 18px 48px rgba(0, 0, 0, .25);
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: start;
      padding: clamp(20px, 4vw, 34px);
      background: linear-gradient(145deg, #0c2137, #0a1828);
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--cyan);
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.65rem, 4.6vw, 2.75rem);
      line-height: 1.08;
      letter-spacing: -.035em;
      text-wrap: balance;
    }

    .subtitle {
      max-width: 54ch;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: .93rem;
    }

    .motion-toggle {
      flex: none;
      border: 1px solid #2d6070;
      border-radius: 9px;
      padding: 9px 12px;
      background: #0c2b33;
      color: #bdf8ea;
      font: inherit;
      font-size: .78rem;
      font-weight: 750;
      cursor: pointer;
    }

    [role="tablist"] {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding: 10px;
      border-top: 1px solid #233a53;
      border-bottom: 1px solid #233a53;
      background: #0d1d30;
    }

    [role="tab"] {
      flex: none;
      border: 0;
      border-radius: 8px;
      padding: 9px 14px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: .84rem;
      font-weight: 750;
      white-space: nowrap;
      cursor: pointer;
    }

    [role="tab"][aria-selected="true"] {
      background: #1c3450;
      color: #fff;
      box-shadow: inset 0 0 0 1px #31557b;
    }

    [role="tab"]:focus-visible,
    .motion-toggle:focus-visible {
      outline: 3px solid var(--violet);
      outline-offset: 2px;
    }

    [role="tabpanel"] {
      min-height: clamp(310px, 48vw, 430px);
      padding: clamp(10px, 2vw, 20px);
    }

    [role="tabpanel"][hidden] { display: none; }
    svg { width: 100%; height: auto; display: block; }

    .node rect,
    .node circle {
      fill: var(--surface-2);
      stroke: #3d6d96;
      stroke-width: 2;
    }

    .node text {
      fill: var(--ink);
      font-size: 15px;
      font-weight: 750;
    }

    .node .sub {
      fill: var(--muted);
      font-size: 10px;
      font-weight: 450;
    }

    .flow {
      fill: none;
      stroke: var(--cyan);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 10 10;
      animation: dash 1.15s linear infinite;
    }

    .flow.mint { stroke: var(--mint); }
    .flow.violet { stroke: var(--violet); }
    .motion-paused .flow { animation-play-state: paused; }

    .caption {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 16px;
      border-top: 1px solid #233a53;
      color: var(--muted);
      font-size: .76rem;
    }

    .caption b { color: var(--ink); }
    @keyframes dash { to { stroke-dashoffset: -40; } }

    @media (max-width: 620px) {
      header { display: block; }
      .motion-toggle { margin-top: 14px; }
      .node text { font-size: 12px; }
      .node .sub { font-size: 9px; }
      .caption { display: block; }
    }

    @media (prefers-reduced-motion: reduce) {
      .flow { animation: none; }
    }
  </style>
</head>
<body>
  <main class="diagram" id="diagram">
    <header>
      <div>
        <p class="eyebrow">Tabbed animated architecture</p>
        <h1>一张图，解释四个系统问题</h1>
        <p class="subtitle">每个标签页拥有独立结构和路径动画；默认页不依赖交互也能表达完整论点。</p>
      </div>
      <button class="motion-toggle" id="motion-toggle" type="button">暂停全部动效</button>
    </header>

    <nav role="tablist" aria-label="系统架构视角">
      <button id="tab-goal" role="tab" aria-selected="true" aria-controls="panel-goal" tabindex="0">目标总览</button>
      <button id="tab-control" role="tab" aria-selected="false" aria-controls="panel-control" tabindex="-1">控制面</button>
      <button id="tab-data" role="tab" aria-selected="false" aria-controls="panel-data" tabindex="-1">数据面</button>
      <button id="tab-recovery" role="tab" aria-selected="false" aria-controls="panel-recovery" tabindex="-1">故障恢复</button>
    </nav>

    <section id="panel-goal" role="tabpanel" aria-labelledby="tab-goal">
      <svg viewBox="0 0 820 390" role="img" aria-label="目标经过计划、执行和验证形成证据闭环">
        <path class="flow" d="M150 205H272M392 205H514M634 205H742"/>
        <path class="flow mint" d="M742 270C625 350 220 350 90 270"/>
        <g class="node">
          <rect x="32" y="150" width="118" height="110" rx="20"/><text x="91" y="198" text-anchor="middle">目标</text><text class="sub" x="91" y="224" text-anchor="middle">结果与边界</text>
          <rect x="272" y="150" width="120" height="110" rx="20"/><text x="332" y="198" text-anchor="middle">计划</text><text class="sub" x="332" y="224" text-anchor="middle">任务与依赖</text>
          <rect x="514" y="150" width="120" height="110" rx="20"/><text x="574" y="198" text-anchor="middle">执行</text><text class="sub" x="574" y="224" text-anchor="middle">模型与工具</text>
          <rect x="700" y="150" width="96" height="110" rx="20"/><text x="748" y="198" text-anchor="middle">验证</text><text class="sub" x="748" y="224" text-anchor="middle">证据门禁</text>
        </g>
        <text x="410" y="65" fill="#edf6ff" font-size="27" font-weight="800" text-anchor="middle">目标 → 计划 → 执行 → 证据</text>
        <text x="410" y="96" fill="#91a7bf" font-size="13" text-anchor="middle">失败反馈回到最小相关步骤，不抹掉已经发生的事实</text>
      </svg>
    </section>

    <section id="panel-control" role="tabpanel" aria-labelledby="tab-control" hidden>
      <svg viewBox="0 0 820 390" role="img" aria-label="任务控制平面向四个执行守卫下发控制信号">
        <g class="node">
          <rect x="60" y="52" width="700" height="76" rx="18"/><text x="410" y="84" text-anchor="middle">任务控制平面</text><text class="sub" x="410" y="108" text-anchor="middle">目标、状态、预算、批准与租约的业务权威</text>
          <rect x="48" y="250" width="150" height="90" rx="18"/><text x="123" y="288" text-anchor="middle">调度器</text><text class="sub" x="123" y="312" text-anchor="middle">分配运行</text>
          <rect x="240" y="250" width="150" height="90" rx="18"/><text x="315" y="288" text-anchor="middle">权限服务</text><text class="sub" x="315" y="312" text-anchor="middle">最小授权</text>
          <rect x="432" y="250" width="150" height="90" rx="18"/><text x="507" y="288" text-anchor="middle">预算守卫</text><text class="sub" x="507" y="312" text-anchor="middle">时长与成本</text>
          <rect x="624" y="250" width="150" height="90" rx="18"/><text x="699" y="288" text-anchor="middle">恢复协调器</text><text class="sub" x="699" y="312" text-anchor="middle">暂停与接管</text>
        </g>
        <path class="flow violet" d="M123 128V244M315 128V244M507 128V244M699 128V244"/>
        <circle r="7" fill="#fff"><animateMotion dur="2.4s" repeatCount="indefinite" path="M123 134V238"/></circle>
        <circle r="7" fill="#fff"><animateMotion dur="2.4s" begin="-.8s" repeatCount="indefinite" path="M507 134V238"/></circle>
      </svg>
    </section>

    <section id="panel-data" role="tabpanel" aria-labelledby="tab-data" hidden>
      <svg viewBox="0 0 820 390" role="img" aria-label="消息、工具结果和产物沿持久事件链流动">
        <path class="flow" d="M122 210C205 92 286 92 368 210S528 328 610 210S720 112 780 210"/>
        <g class="node">
          <circle cx="88" cy="210" r="54"/><text x="88" y="205" text-anchor="middle">消息</text><text class="sub" x="88" y="229" text-anchor="middle">用户意图</text>
          <circle cx="380" cy="210" r="54"/><text x="380" y="205" text-anchor="middle">工具</text><text class="sub" x="380" y="229" text-anchor="middle">参数与结果</text>
          <circle cx="620" cy="210" r="54"/><text x="620" y="205" text-anchor="middle">事件</text><text class="sub" x="620" y="229" text-anchor="middle">持久事实</text>
          <circle cx="780" cy="210" r="40"/><text x="780" y="205" text-anchor="middle">投影</text><text class="sub" x="780" y="229" text-anchor="middle">界面状态</text>
        </g>
        <text x="410" y="62" fill="#edf6ff" font-size="25" font-weight="800" text-anchor="middle">数据沿事件链前进，界面只是可重建投影</text>
        <circle r="7" fill="#55e6b4"><animateMotion dur="4.5s" repeatCount="indefinite" path="M122 210C205 92 286 92 368 210S528 328 610 210S720 112 780 210"/></circle>
      </svg>
    </section>

    <section id="panel-recovery" role="tabpanel" aria-labelledby="tab-recovery" hidden>
      <svg viewBox="0 0 820 390" role="img" aria-label="系统从运行中断，经事件核对和副作用确认后继续执行">
        <g class="node">
          <rect x="48" y="150" width="130" height="105" rx="20"/><text x="113" y="193" text-anchor="middle">运行中断</text><text class="sub" x="113" y="219" text-anchor="middle">进程不可用</text>
          <rect x="255" y="150" width="130" height="105" rx="20"/><text x="320" y="193" text-anchor="middle">读取事件</text><text class="sub" x="320" y="219" text-anchor="middle">最后已知事实</text>
          <rect x="462" y="150" width="130" height="105" rx="20"/><text x="527" y="193" text-anchor="middle">核对副作用</text><text class="sub" x="527" y="219" text-anchor="middle">外部结果可确认</text>
          <rect x="665" y="150" width="110" height="105" rx="20"/><text x="720" y="193" text-anchor="middle">继续执行</text><text class="sub" x="720" y="219" text-anchor="middle">幂等恢复</text>
        </g>
        <path class="flow mint" d="M178 202H249M385 202H456M592 202H659"/>
        <path class="flow violet" d="M720 255C640 344 198 344 113 255"/>
        <text x="410" y="62" fill="#edf6ff" font-size="26" font-weight="800" text-anchor="middle">恢复不是重跑全部，而是从事实继续</text>
        <text x="410" y="94" fill="#91a7bf" font-size="13" text-anchor="middle">先确认外部动作是否已经发生，再决定重放、补偿或继续</text>
      </svg>
    </section>

    <div class="caption"><span><b>交互：</b>键盘方向键或点击切换标签页</span><span>路径动画可统一暂停</span></div>
  </main>

  <script>
    const diagram = document.querySelector('#diagram');
    const tabs = [...document.querySelectorAll('[role="tab"]')];
    const panels = [...document.querySelectorAll('[role="tabpanel"]')];
    const motionToggle = document.querySelector('#motion-toggle');
    let motionPaused = matchMedia('(prefers-reduced-motion: reduce)').matches;

    function syncMotion() {
      diagram.classList.toggle('motion-paused', motionPaused);
      document.querySelectorAll('svg').forEach((svg) => {
        if (motionPaused) svg.pauseAnimations?.();
        else svg.unpauseAnimations?.();
      });
      motionToggle.textContent = motionPaused ? '继续全部动效' : '暂停全部动效';
    }

    function selectTab(nextIndex, focus = false) {
      tabs.forEach((tab, index) => {
        const selected = index === nextIndex;
        tab.setAttribute('aria-selected', String(selected));
        tab.tabIndex = selected ? 0 : -1;
        panels[index].hidden = !selected;
      });
      panels[nextIndex].querySelector('svg')?.setCurrentTime?.(0);
      if (focus) tabs[nextIndex].focus();
      syncMotion();
    }

    tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => selectTab(index));
      tab.addEventListener('keydown', (event) => {
        const last = tabs.length - 1;
        let next = index;
        if (event.key === 'ArrowRight') next = index === last ? 0 : index + 1;
        else if (event.key === 'ArrowLeft') next = index === 0 ? last : index - 1;
        else if (event.key === 'Home') next = 0;
        else if (event.key === 'End') next = last;
        else return;
        event.preventDefault();
        selectTab(next, true);
      });
    });

    motionToggle.addEventListener('click', () => {
      motionPaused = !motionPaused;
      syncMotion();
    });

    syncMotion();
  </script>
</body>
</html>
