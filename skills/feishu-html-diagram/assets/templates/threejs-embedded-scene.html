<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="use-iframe" content="true">
  <meta name="html-box-height-mode" content="auto">
  <meta name="description" content="一个具备响应式渲染、拖动旋转、暂停、资源释放和中文降级说明的 Three.js 飞书嵌入场景。">
  <title>Three.js 三维系统拓扑</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <style>
    :root {
      color-scheme: dark;
      --ink: #edf6ff;
      --muted: #8fa5bd;
      --paper: #050914;
      --surface: #091426;
      --line: #25415f;
      --cyan: #4cc9f0;
      --violet: #8b5cf6;
      --mint: #44d19d;
      --amber: #ffd166;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 0; }

    body {
      padding: clamp(12px, 3vw, 28px);
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      line-height: 1.5;
    }

    .diagram {
      width: 100%;
      max-width: 100%;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: start;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--cyan);
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.65rem, 4.6vw, 2.75rem);
      line-height: 1.08;
      letter-spacing: -.035em;
      text-wrap: balance;
    }

    .subtitle {
      max-width: 58ch;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: .93rem;
    }

    button {
      flex: none;
      border: 1px solid #2b4c6c;
      border-radius: 9px;
      padding: 9px 12px;
      background: #0d1b2d;
      color: #c8e6ff;
      font: inherit;
      font-size: .78rem;
      font-weight: 750;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid var(--violet);
      outline-offset: 2px;
    }

    .stage {
      position: relative;
      height: clamp(420px, 62vw, 560px);
      margin-top: 20px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: radial-gradient(circle at 50% 35%, #102c4d, #050914 70%);
      box-shadow: 0 18px 48px rgba(0, 0, 0, .28);
    }

    .canvas-host,
    .loading {
      position: absolute;
      inset: 0;
    }

    .canvas-host canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .loading {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: .82rem;
    }

    .annotation,
    .legend,
    .fallback {
      position: absolute;
      border: 1px solid #294760;
      border-radius: 11px;
      background: rgba(6, 17, 29, .86);
      backdrop-filter: blur(8px);
    }

    .annotation {
      top: 16px;
      right: 16px;
      max-width: 250px;
      padding: 12px;
      color: #a9bdd1;
      font-size: .72rem;
    }

    .annotation b,
    .fallback b { color: #fff; }

    .legend {
      bottom: 16px;
      left: 16px;
      display: grid;
      gap: 7px;
      padding: 12px;
      color: #a7bed3;
      font-size: .7rem;
    }

    .legend i {
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-right: 7px;
      border-radius: 50%;
    }

    .fallback {
      inset: 24% 17%;
      display: none;
      place-items: center;
      padding: 24px;
      text-align: center;
      color: #b9c9d8;
      font-size: .84rem;
    }

    .footnote {
      margin: 11px 0 0;
      color: #70849a;
      font-size: .7rem;
    }

    @media (max-width: 620px) {
      header { display: block; }
      button { margin-top: 14px; }
      .annotation { max-width: 185px; font-size: .66rem; }
      .legend { font-size: .64rem; }
      .fallback { inset: 24% 10%; }
    }
  </style>
</head>
<body>
  <main class="diagram">
    <header>
      <div>
        <p class="eyebrow">Three.js embedded scene</p>
        <h1>三维系统拓扑：看见层级，也看见调用</h1>
        <p class="subtitle">拖动旋转视角；流动光点表示请求穿过接入层、服务层和数据层。</p>
      </div>
      <button id="motion-toggle" type="button">暂停旋转</button>
    </header>

    <section class="stage" id="stage">
      <div class="canvas-host" id="canvas-host"></div>
      <div class="loading" id="loading">正在加载 Three.js 三维场景…</div>

      <div class="annotation">
        <b>阅读重点</b><br>
        垂直高度表示责任层级，水平距离表示服务域；连线只表达真实调用，不表示组织隶属。
      </div>

      <div class="legend">
        <span><i style="background: var(--cyan)"></i>接入层</span>
        <span><i style="background: var(--violet)"></i>服务层</span>
        <span><i style="background: var(--mint)"></i>数据层</span>
        <span><i style="background: var(--amber)"></i>运行请求</span>
      </div>

      <div class="fallback" id="fallback">
        <p><b>三维场景未能加载。</b><br>静态结论仍然成立：请求从接入层进入服务域，所有业务状态最终写入数据层，三层职责保持分离。</p>
      </div>
    </section>

    <p class="footnote">运行时依赖：three@0.185.1（jsDelivr）。发布前需在目标飞书客户端验证 CDN 与 WebGL。</p>
  </main>

  <script type="module">
    const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js';
    const host = document.querySelector('#canvas-host');
    const stage = document.querySelector('#stage');
    const loading = document.querySelector('#loading');
    const fallback = document.querySelector('#fallback');
    const motionToggle = document.querySelector('#motion-toggle');

    let renderer;
    let animationFrame;
    let resizeObserver;

    try {
      const THREE = await import(THREE_URL);
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(42, 1, .1, 100);
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      host.appendChild(renderer.domElement);

      camera.position.set(8, 7, 11);
      camera.lookAt(0, 0, 0);
      scene.add(new THREE.AmbientLight(0x93c5fd, 1.3));
      const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
      keyLight.position.set(6, 10, 8);
      scene.add(keyLight);

      const root = new THREE.Group();
      scene.add(root);

      const nodeSpecs = [
        [-4, 3, 0, 0x4cc9f0], [-1.3, 3, 0, 0x4cc9f0], [1.3, 3, 0, 0x4cc9f0], [4, 3, 0, 0x4cc9f0],
        [-4, 0, 0, 0x8b5cf6], [-1.3, 0, 0, 0x8b5cf6], [1.3, 0, 0, 0x8b5cf6], [4, 0, 0, 0x8b5cf6],
        [-3, -3, 0, 0x44d19d], [0, -3, 0, 0x44d19d], [3, -3, 0, 0x44d19d],
      ];

      const nodes = nodeSpecs.map(([x, y, z, color], index) => {
        const geometry = index < 4
          ? new THREE.OctahedronGeometry(.58)
          : index < 8
            ? new THREE.BoxGeometry(1.1, .75, 1.1)
            : new THREE.CylinderGeometry(.65, .65, .7, 24);
        const material = new THREE.MeshStandardMaterial({
          color,
          roughness: .28,
          metalness: .22,
          transparent: true,
          opacity: .94,
        });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(x, y, z);
        root.add(mesh);
        return mesh;
      });

      const edgePairs = [[0, 4], [1, 5], [2, 6], [3, 7], [4, 5], [5, 6], [6, 7], [4, 8], [5, 9], [6, 9], [7, 10]];
      const curves = edgePairs.map(([from, to]) => {
        const curve = new THREE.LineCurve3(nodes[from].position.clone(), nodes[to].position.clone());
        const geometry = new THREE.BufferGeometry().setFromPoints(curve.getPoints(2));
        root.add(new THREE.Line(geometry, new THREE.LineBasicMaterial({ color: 0x315c7d, transparent: true, opacity: .8 })));
        return curve;
      });

      const particles = curves.map((curve, index) => {
        const mesh = new THREE.Mesh(
          new THREE.SphereGeometry(.11, 12, 12),
          new THREE.MeshBasicMaterial({ color: 0xffd166 }),
        );
        root.add(mesh);
        return { mesh, curve, progress: index / curves.length };
      });

      const grid = new THREE.GridHelper(13, 13, 0x24445e, 0x16283b);
      grid.position.y = -3.5;
      root.add(grid);

      let motionPaused = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let dragging = false;
      let lastPointerX = 0;

      function syncMotionLabel() {
        motionToggle.textContent = motionPaused ? '继续旋转' : '暂停旋转';
      }

      motionToggle.addEventListener('click', () => {
        motionPaused = !motionPaused;
        syncMotionLabel();
      });

      stage.addEventListener('pointerdown', (event) => {
        dragging = true;
        lastPointerX = event.clientX;
        stage.setPointerCapture(event.pointerId);
      });

      stage.addEventListener('pointermove', (event) => {
        if (!dragging) return;
        root.rotation.y += (event.clientX - lastPointerX) * .008;
        lastPointerX = event.clientX;
      });

      stage.addEventListener('pointerup', () => { dragging = false; });
      stage.addEventListener('pointercancel', () => { dragging = false; });

      function resize() {
        const width = host.clientWidth;
        const height = host.clientHeight;
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }

      resizeObserver = new ResizeObserver(resize);
      resizeObserver.observe(host);
      resize();
      syncMotionLabel();

      const clock = new THREE.Clock();
      function render() {
        animationFrame = requestAnimationFrame(render);
        const delta = clock.getDelta();
        if (!motionPaused && !dragging) root.rotation.y += delta * .16;
        particles.forEach((particle) => {
          if (!motionPaused) particle.progress = (particle.progress + delta * .24) % 1;
          particle.mesh.position.copy(particle.curve.getPoint(particle.progress));
        });
        renderer.render(scene, camera);
      }

      loading.remove();
      render();
    } catch (error) {
      loading.remove();
      fallback.style.display = 'grid';
      console.error('three-load-failed', error);
    }

    addEventListener('pagehide', () => {
      if (animationFrame) cancelAnimationFrame(animationFrame);
      resizeObserver?.disconnect();
      renderer?.dispose();
    }, { once: true });
  </script>
</body>
</html>
